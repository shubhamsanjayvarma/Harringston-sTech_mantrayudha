[project]
name = "novamart-ai"
version = "0.1.0"
description = "NovaMart AI Customer Support Agent with In-Memory Relational Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
